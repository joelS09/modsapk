<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>Panel admin</title>
<style>
*{box-sizing:border-box;margin:0}
body{background:#0d1017;color:#e8ebf2;font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:80px}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{width:100%;background:#171c27;border:1px solid #2a3345;border-radius:10px;padding:9px 12px}
input[type=checkbox]{width:auto}input[type=color]{padding:2px;height:40px}
label{display:block;font-size:.85rem;color:#9aa6bd;margin-top:12px}label.ck{display:flex;gap:8px;align-items:center;color:#e8ebf2}
.btn{background:#222a3a;border:1px solid #33405a;border-radius:10px;padding:9px 14px;cursor:pointer}
.btn.pri{background:#39ff6a;border-color:#39ff6a;color:#000;font-weight:700}.btn.del{color:#ff7b7b}
header{position:sticky;top:0;background:#0d1017ee;border-bottom:1px solid #222a3a;padding:10px 14px;z-index:5;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tab[aria-selected=true]{background:#39ff6a;color:#000;border-color:#39ff6a}
main{max-width:760px;margin:auto;padding:14px}
.box{background:#131824;border:1px solid #222a3a;border-radius:14px;padding:14px;margin-bottom:14px}
.list{display:flex;flex-direction:column;gap:6px;margin:10px 0}
.item{display:flex;gap:10px;align-items:center;padding:8px;border-radius:10px;border:1px solid #222a3a;cursor:pointer;background:#171c27;text-align:left}
.item[aria-current=true]{border-color:#39ff6a}.item img{width:40px;height:40px;border-radius:10px;object-fit:cover}
.sh{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.sh div{position:relative}.sh img{height:90px;border-radius:8px}
.sh button{position:absolute;top:2px;right:2px;background:#000b;border:0;border-radius:99px;width:24px;height:24px;color:#fff;cursor:pointer}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.mut{color:#9aa6bd;font-size:.85rem}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#222a3a;border:1px solid #39ff6a;padding:10px 18px;border-radius:12px;display:none;z-index:9;max-width:92%}
.warn{color:#ffb74d}.pv{display:flex;gap:10px;align-items:center;border-radius:14px;padding:14px;margin-top:12px}
</style></head><body>
<header>
<button class="btn tab" data-t="apps">Apps</button><button class="btn tab" data-t="site">Sitio</button><button class="btn tab" data-t="pub">Publicar</button>
<span class="mut" id="stat" style="margin-left:auto"></span>
</header>
<main id="m"></main><div id="toast"></div>
<input type="file" id="fImp" accept=".json" multiple hidden>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let apps=[],sel=-1,tab='apps',dirty=false,cfg={siteName:'modsapk',tagline:'Apps y juegos modificados para Android',siteUrl:'https://TU-USUARIO.github.io/TU-REPO/',logo:'',rgb:false,categories:['Juegos','Apps'],colors:{bg:'#0b0d12',card:'#151922',text:'#eef1f6',accent:'#39ff6a'}};
let gh={owner:'',repo:'',branch:'main',token:'',keep:true};try{Object.assign(gh,JSON.parse(localStorage.getItem('gh')||'{}'))}catch(_){}
const PRE={'Neón verde':'#39ff6a','Azul':'#3b9cff','Rosa':'#ff4fa3','Naranja':'#ff8a39','Violeta':'#a66bff'};
const toast=(t,ms=2600)=>{const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',ms)};
const mark=()=>{dirty=true;stat()};
const size=()=>new Blob([JSON.stringify(apps)]).size;
const stat=()=>$('#stat').textContent=`${apps.length} apps · ${(size()/1048576).toFixed(1)} MB${dirty?' · sin descargar':''}`;
onbeforeunload=e=>{if(dirty){e.preventDefault();return''}};
/* ---- imágenes: se comprimen a WebP en el navegador ---- */
const rd=f=>new Promise(r=>{const x=new FileReader();x.onload=()=>r(x.result);x.readAsDataURL(f)});
const li=s=>new Promise((o,n)=>{const i=new Image();i.onload=()=>o(i);i.onerror=n;i.src=s});
async function shrink(src,max,q=.72){const i=await li(src),k=Math.min(1,max/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=Math.round(i.width*k);c.height=Math.round(i.height*k);c.getContext('2d').drawImage(i,0,0,c.width,c.height);let o=c.toDataURL('image/webp',q);if(!o.startsWith('data:image/webp'))o=c.toDataURL('image/jpeg',q);return o.length<src.length?o:src}
const LIM={img:192,banner:800,shot:640,logo:128};
async function optimize(){let before=size(),n=0;for(const a of apps){n++;toast(`Optimizando ${n}/${apps.length}…`,60000);
 try{if(a.img)a.img=await shrink(a.img,LIM.img);if(a.banner)a.banner=await shrink(a.banner,LIM.banner);if(a.shots)a.shots=await Promise.all(a.shots.map(s=>shrink(s,LIM.shot)))}catch(_){}}
 mark();toast(`Listo: de ${(before/1048576).toFixed(1)} MB a ${(size()/1048576).toFixed(1)} MB`,5000);draw()}
/* ---- vistas ---- */
function draw(){document.querySelectorAll('.tab').forEach(b=>b.setAttribute('aria-selected',b.dataset.t===tab));stat();$('#m').innerHTML=tab==='apps'?vApps():tab==='site'?vSite():vPub()}
function vApps(){const a=apps[sel];return`<div class="box"><div class="g2"><button class="btn" id="imp">Importar apps.json</button><button class="btn pri" id="new">Nueva app</button></div>
${size()>6e6?`<p class="warn" style="margin-top:10px">El catálogo pesa ${(size()/1048576).toFixed(1)} MB. Pulsa «Optimizar imágenes» para reducirlo sin perder datos.</p>`:''}
<button class="btn" id="opt" style="margin-top:10px;width:100%">Optimizar imágenes de todas las apps</button>
<div class="list">${apps.length?apps.map((x,i)=>`<button class="item" data-i="${i}" aria-current="${i===sel}">${x.img?`<img src="${esc(x.img)}" alt="">`:'<span style="width:40px"></span>'}<span><b>${esc(x.name||'Sin nombre')}</b><br><span class="mut">${esc(x.cat)} · ${esc(x.ver||'')}</span></span></button>`).join(''):'<p class="mut">Importa tu apps.json actual para empezar.</p>'}</div></div>${a?form(a):''}`}
function form(a){const cats=[...new Set([...cfg.categories,a.cat].filter(Boolean))];
 return`<div class="box"><b>Editar app</b>
<label>Nombre<input data-k="name" value="${esc(a.name)}"></label>
<label>Categoría<select data-k="cat">${cats.map(c=>`<option ${c===a.cat?'selected':''}>${esc(c)}</option>`).join('')}</select></label>
<label>Descripción corta<input data-k="sub" value="${esc(a.sub)}"></label>
<div class="g2"><label>Versión<input data-k="ver" value="${esc(a.ver)}"></label><label>Tamaño<input data-k="size" value="${esc(a.size)}"></label></div>
<div class="g2"><label>Desarrollador<input data-k="dev" value="${esc(a.dev)}"></label><label>Etiqueta<input data-k="tag" value="${esc(a.tag)}"></label></div>
<label>Enlace de MediaFire<input data-k="link" inputmode="url" value="${esc(a.link)}"></label>
<label>Descripción<textarea data-k="desc" rows="3">${esc(a.desc)}</textarea></label>
<label>Características (una por línea)<textarea data-k="feats" rows="4">${esc((a.feats||[]).join('\n'))}</textarea></label>
<label class="ck"><input type="checkbox" data-k="featured" ${a.featured?'checked':''}> Destacada</label>
<label class="ck"><input type="checkbox" data-k="trending" ${a.trending?'checked':''}> En tendencia</label>
<label>Icono (se comprime a ${LIM.img}px)<input type="file" accept="image/*" data-up="img"></label>${a.img?`<div class="sh"><div><img src="${esc(a.img)}" alt=""></div></div>`:''}
<label>Banner (se comprime a ${LIM.banner}px)<input type="file" accept="image/*" data-up="banner"></label>${a.banner?`<div class="sh"><div><img src="${esc(a.banner)}" alt=""></div></div>`:''}
<label>Capturas (se comprimen a ${LIM.shot}px)<input type="file" accept="image/*" multiple data-up="shots"></label>
<div class="sh">${(a.shots||[]).map((s,i)=>`<div><img src="${esc(s)}" alt=""><button data-rs="${i}" aria-label="Quitar">×</button></div>`).join('')}</div>
<button class="btn del" id="del" style="margin-top:16px">Eliminar app</button></div>`}
function vSite(){const c=cfg.colors;return`<div class="box"><b>Identidad</b>
<label>Nombre del sitio<input data-c="siteName" value="${esc(cfg.siteName)}"></label>
<label>Frase principal (título SEO)<input data-c="tagline" value="${esc(cfg.tagline)}"></label>
<label>Logo (se comprime a ${LIM.logo}px)<input type="file" accept="image/*" data-logo></label>${cfg.logo?`<div class="sh"><div><img src="${esc(cfg.logo)}" alt=""><button data-rl aria-label="Quitar">×</button></div></div>`:''}</div>
<div class="box"><b>Colores</b><div class="g2">${[['bg','Fondo'],['card','Tarjetas'],['text','Texto'],['accent','Acento']].map(([k,n])=>`<label>${n}<input type="color" data-col="${k}" value="${c[k]}"></label>`).join('')}</div>
<div class="sh">${Object.entries(PRE).map(([n,v])=>`<button class="btn" data-pre="${v}">${n}</button>`).join('')}</div>
<div class="pv" style="background:${c.card};color:${c.text}"><span style="background:${c.accent};width:40px;height:40px;border-radius:10px"></span><span>Vista previa · fondo de tarjeta</span></div>
<label class="ck" style="margin-top:14px"><input type="checkbox" data-rgb ${cfg.rgb?'checked':''}> Modo RGB multicolor activado por defecto</label>
<p class="mut">Los visitantes también pueden activarlo o apagarlo con el botón RGB del sitio.</p></div>
<div class="box"><b>Categorías</b><label>Una por línea<textarea data-cats rows="4">${esc(cfg.categories.join('\n'))}</textarea></label>
<p class="mut">Si renombras una categoría, cambia también la categoría de las apps que ya la usan.</p></div>`}
function vPub(){const f=build();return`<div class="box"><b>Dirección del sitio</b><label>URL pública (termina en /)<input data-c="siteUrl" value="${esc(cfg.siteUrl)}"></label>
<p class="mut">Se usa para el sitemap.xml y el robots.txt que ayudan a Google a encontrar tu sitio.</p></div>
<div class="box"><b>Publicar en GitHub</b>
<div class="g2"><label>Usuario<input data-g="owner" value="${esc(gh.owner)}" placeholder="tu-usuario"></label><label>Repositorio<input data-g="repo" value="${esc(gh.repo)}" placeholder="modsapk"></label></div>
<div class="g2"><label>Rama<input data-g="branch" value="${esc(gh.branch)}"></label><label>Token<input type="password" data-g="token" value="${esc(gh.token)}" placeholder="github_pat_…" autocomplete="off"></label></div>
<label class="ck"><input type="checkbox" data-gk ${gh.keep?'checked':''}> Recordar el token solo en este navegador</label>
<button class="btn pri" id="pub" style="width:100%;margin-top:12px">Publicar ahora</button>
<p class="mut">Crea un token «fine-grained» en GitHub → Settings → Developer settings, solo para este repositorio, con permiso <i>Contents: Read and write</i>. El token nunca se guarda en los archivos del sitio.</p></div>
<div class="box"><b>Archivos a subir</b><div class="list">${f.map(x=>`<div class="mut">${x.name} · ${(x.data.length/1024).toFixed(0)} KB</div>`).join('')}</div>
<button class="btn pri" id="zip" style="width:100%">Descargar todo (.zip)</button></div>
<div class="box mut"><b style="color:#e8ebf2">Pasos</b><ol style="padding-left:20px"><li>Descarga el .zip y descomprímelo.</li><li>Sube todos los archivos al repositorio de GitHub (reemplazando los anteriores).</li><li>Espera 1–2 minutos y entra al sitio.</li><li>En Google Search Console envía <code>${esc(cfg.siteUrl)}sitemap.xml</code>.</li></ol></div>`}
/* ---- exportar ---- */
function build(){const per=12e6,pages=[];let cur=[],sz=0;for(const a of apps){const l=JSON.stringify(a).length;if(cur.length&&sz+l>per){pages.push(cur);cur=[];sz=0}cur.push(a);sz+=l}pages.push(cur);
 const names=pages.map((_,i)=>i?`apps-${i+1}.json`:'apps.json'),url=cfg.siteUrl.replace(/\/?$/,'/'),day=new Date().toISOString().slice(0,10);
 return[...pages.map((p,i)=>({name:names[i],data:JSON.stringify(p)})),{name:'pages.json',data:JSON.stringify({total:apps.length,pages:names})},{name:'config.json',data:JSON.stringify(cfg,null,1)},
 {name:'sitemap.xml',data:`<?xml version="1.0" encoding="UTF-8"?>\n<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">\n  <url><loc>${esc(url)}</loc><lastmod>${day}</lastmod><changefreq>daily</changefreq><priority>1.0</priority></url>\n</urlset>\n`},
 {name:'robots.txt',data:`User-agent: *\nAllow: /\n\nSitemap: ${url}sitemap.xml\n`}]}
function save(n,blob){const l=document.createElement('a');l.href=URL.createObjectURL(blob);l.download=n;document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(l.href),2000)}
async function zip(){const f=build();if(window.JSZip){const z=new JSZip();f.forEach(x=>z.file(x.name,x.data));save('modsapk-sitio.zip',await z.generateAsync({type:'blob',compression:'DEFLATE'}))}else f.forEach((x,i)=>setTimeout(()=>save(x.name,new Blob([x.data])),i*400));dirty=false;stat();toast('Descarga lista')}

const b64=t=>{const b=new TextEncoder().encode(t);let s='';for(let i=0;i<b.length;i+=32768)s+=String.fromCharCode.apply(null,b.subarray(i,i+32768));return btoa(s)};
const gsave=()=>{try{localStorage.setItem('gh',JSON.stringify(gh.keep?gh:{...gh,token:''}))}catch(_){}};
async function publish(){if(!gh.owner||!gh.repo||!gh.token)return toast('Completa usuario, repositorio y token',4000);
 const f=build(),base=`https://api.github.com/repos/${gh.owner}/${gh.repo}/contents/`,H={Authorization:'Bearer '+gh.token,Accept:'application/vnd.github+json','Content-Type':'application/json'};
 try{for(let i=0;i<f.length;i++){const x=f[i];toast(`Publicando ${i+1}/${f.length}: ${x.name}…`,120000);
  let sha;const g=await fetch(base+x.name+'?ref='+encodeURIComponent(gh.branch),{headers:H});
  if(g.ok)sha=(await g.json()).sha;else if(g.status!==404)throw g.status;
  const r=await fetch(base+x.name,{method:'PUT',headers:H,body:JSON.stringify({message:'Actualizar '+x.name+' desde el panel',content:b64(x.data),branch:gh.branch,sha})});
  if(!r.ok)throw r.status}
  dirty=false;stat();toast('Publicado. El sitio se actualiza en 1–2 minutos.',6000)}
 catch(c){toast(c===401?'Token inválido o vencido':c===403?'El token no tiene permiso de escritura':c===404?'Repositorio o rama no encontrados':c===422?'GitHub rechazó el archivo (revisa la rama)':'Error de red al publicar',6000)}}
/* ---- eventos ---- */
document.addEventListener('click',async e=>{const t=e.target.closest('button');if(!t)return;
 if(t.dataset.t){tab=t.dataset.t;draw()}
 else if(t.id==='imp')$('#fImp').click();
 else if(t.id==='new'){apps.unshift({id:'app-'+Date.now().toString(36),name:'',cat:cfg.categories[0]||'Apps',sub:'',dev:'',ver:'',size:'',rating:4.5,votes:'',age:'10+',sample:false,c1:cfg.colors.accent,c2:'#0b3d1c',icon:'app',featured:false,trending:false,tag:'Novedad',updated:'Hoy',desc:'',feats:[],link:'',img:'',banner:'',shots:[]});sel=0;mark();draw()}
 else if(t.dataset.i){sel=+t.dataset.i;draw();scrollTo(0,document.body.scrollHeight)}
 else if(t.id==='del'){if(confirm('¿Eliminar esta app? Podrás recuperarla importando tu apps.json anterior.')){apps.splice(sel,1);sel=-1;mark();draw()}}
 else if(t.id==='opt')optimize();
 else if(t.dataset.rs!==undefined){apps[sel].shots.splice(+t.dataset.rs,1);mark();draw()}
 else if(t.dataset.rl!==undefined){cfg.logo='';mark();draw()}
 else if(t.dataset.pre){cfg.colors.accent=t.dataset.pre;mark();draw()}
 else if(t.id==='zip')zip();else if(t.id==='pub')publish()});
document.addEventListener('input',e=>{const t=e.target,a=apps[sel];
 if(t.dataset.k&&a){const k=t.dataset.k;a[k]=t.type==='checkbox'?t.checked:k==='feats'?t.value.split('\n').map(s=>s.trim()).filter(Boolean):t.value;if(k==='name'&&/^app-/.test(a.id)){a.id=t.value.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||a.id}mark()}
 else if(t.dataset.g){gh[t.dataset.g]=t.value.trim();gsave()}
 else if(t.dataset.gk!==undefined){gh.keep=t.checked;gsave()}
 else if(t.dataset.c){cfg[t.dataset.c]=t.value;mark()}
 else if(t.dataset.col){cfg.colors[t.dataset.col]=t.value;mark();{const pv=document.querySelector('.pv');if(pv){const c=cfg.colors;pv.style.background=c.card;pv.style.color=c.text;pv.firstElementChild.style.background=c.accent}}}
 else if(t.dataset.rgb!==undefined){cfg.rgb=t.checked;mark()}
 else if(t.dataset.cats!==undefined){cfg.categories=t.value.split('\n').map(s=>s.trim()).filter(Boolean);mark()}});
document.addEventListener('change',async e=>{const t=e.target;
 if(t.id==='fImp'){let n=0;const all=[];for(const f of t.files){try{const j=JSON.parse(await f.text());if(Array.isArray(j))all.push(...j);else if(j.siteName){cfg={...cfg,...j,colors:{...cfg.colors,...j.colors}}}}catch(_){toast('Archivo no válido: '+f.name)}}
  if(all.length){apps=all;sel=-1;dirty=false}t.value='';toast(`${apps.length} apps importadas`);draw()}
 else if(t.dataset.up&&t.files.length){const a=apps[sel],k=t.dataset.up;toast('Comprimiendo imagen…',30000);
  if(k==='shots'){for(const f of t.files)(a.shots=a.shots||[]).push(await shrink(await rd(f),LIM.shot))}else a[k]=await shrink(await rd(t.files[0]),LIM[k]);mark();toast('Imagen lista');draw()}
 else if(t.dataset.logo!==undefined&&t.files.length){cfg.logo=await shrink(await rd(t.files[0]),LIM.logo,.85);mark();draw()}});
draw();
</script></body></html>
