<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>modsapk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* Layout: tienda de apps en negro y verde neón. Barra superior fija, chips de categoría,
   carrusel destacado, filas de tendencias, rejilla de apps y ficha de detalle a pantalla completa. */
:root{
  --bg:#050706;
  --surface:#0c1210;
  --surface-2:#131d19;
  --line:#1d2b25;
  --fg:#e9f5ee;
  --muted:#84a393;
  --neon:#39ff6a;
  --neon-dim:#39ff6a26;
  --on-neon:#031007;
  --font-display:'Sora',system-ui,sans-serif;
  --font-body:'DM Sans',system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:16px;line-height:1.5;padding-inline:0;overflow-x:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--neon);outline-offset:2px}
.wrap{width:100%;max-width:1180px;margin-inline:auto;padding-inline:16px}

/* Header */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:#050706e8;backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:12px;height:62px}
.logo{font-family:var(--font-display);font-weight:800;font-size:22px;letter-spacing:-.02em;display:flex;align-items:center;gap:8px}
.logo b{color:var(--neon);text-shadow:0 0 18px var(--neon)}
.logo .mark{width:38px;height:auto;border-radius:11px;box-shadow:0 0 14px var(--neon-dim)}
nav.desk{display:none;gap:4px;margin-left:18px}
nav.desk a,.drawer a,.drawer button.item{padding:8px 14px;border-radius:999px;color:var(--muted);font-weight:500;transition:.2s}
nav.desk a:hover,nav.desk button:hover{color:var(--neon);background:var(--neon-dim)}
nav.desk button{padding:8px 14px;border-radius:999px;color:var(--muted);font-weight:500;transition:.2s}
.sp{flex:1}
.icon-btn{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;color:var(--neon);border:1px solid var(--line);transition:.2s}
.icon-btn:hover{background:var(--neon-dim);box-shadow:0 0 16px var(--neon-dim)}
.icon-btn svg{width:20px;height:20px}
.search{display:flex;align-items:center;gap:8px;height:42px;border:1px solid var(--line);border-radius:999px;padding-inline:14px;background:var(--surface);min-width:0;flex:1;max-width:340px;transition:.2s}
.search:focus-within{border-color:var(--neon);box-shadow:0 0 0 3px var(--neon-dim)}
.search svg{width:18px;height:18px;color:var(--neon);flex:none}
.search input{background:none;border:0;outline:0;color:var(--fg);font:inherit;width:100%;min-width:0}
.search input::placeholder{color:var(--muted)}
.burger{display:grid}

/* Drawer */
.scrim{position:fixed;inset:0;background:#000a;opacity:0;pointer-events:none;transition:.25s;z-index:40}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;bottom:0;left:0;width:min(300px,84vw);background:var(--surface);border-right:1px solid var(--neon);box-shadow:0 0 40px var(--neon-dim);transform:translateX(-102%);transition:transform .3s cubic-bezier(.2,.8,.2,1);z-index:50;padding:calc(20px + env(safe-area-inset-top,0px)) 16px 24px;display:flex;flex-direction:column;gap:4px}
.drawer.on{transform:none}
.drawer .logo{margin-bottom:16px;padding-inline:8px}
.drawer a,.drawer button.item{display:flex;align-items:center;gap:12px;border-radius:12px;font-size:17px;text-align:left;width:100%}
.drawer a:hover,.drawer button.item:hover{background:var(--neon-dim);color:var(--neon)}
.drawer svg{width:20px;height:20px;flex:none}
.drawer .tag{margin-left:auto;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--on-neon);background:var(--neon);padding:2px 8px;border-radius:999px}

/* Chips */
.chips{display:flex;gap:8px;overflow-x:auto;padding-block:14px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 16px;border-radius:999px;border:1px solid var(--line);color:var(--muted);font-weight:700;font-size:13px;letter-spacing:.06em;text-transform:uppercase;transition:.2s}
.chip:hover{color:var(--fg);border-color:var(--neon)}
.chip.on{background:var(--neon);color:var(--on-neon);border-color:var(--neon);box-shadow:0 0 18px var(--neon-dim)}

/* Hero carousel */
.hero{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;padding-block:6px 4px;scrollbar-width:none;margin-inline:-16px;padding-inline:16px;scroll-padding-inline:16px}
.hero::-webkit-scrollbar{display:none}
.slide{flex:none;scroll-snap-align:start;width:min(88%,720px);aspect-ratio:16/9;border-radius:22px;position:relative;overflow:hidden;text-align:left;border:1px solid var(--line);transition:transform .35s cubic-bezier(.2,.8,.2,1),box-shadow .35s,border-color .35s;isolation:isolate}
.slide:hover{transform:translateY(-4px) scale(1.012);border-color:var(--neon);box-shadow:0 14px 40px -12px var(--neon)}
.slide .art{position:absolute;inset:0;z-index:-2}
.slide::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,#0000 35%,#000d)}
.pill{display:inline-block;font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--on-neon);background:var(--neon);padding:4px 12px;border-radius:999px}
.slide .pill{position:absolute;top:14px;left:14px}
.slide .cap{position:absolute;left:18px;right:18px;bottom:16px;display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.slide h3{margin:0;font-family:var(--font-display);font-size:clamp(22px,5vw,34px);letter-spacing:-.02em;line-height:1.1}
.slide p{margin:2px 0 0;color:#cfe5d8;font-size:14px}
.dots{display:flex;gap:6px;justify-content:center;padding-top:12px}
.dots i{width:7px;height:7px;border-radius:99px;background:var(--line);transition:.3s}
.dots i.on{width:24px;background:var(--neon);box-shadow:0 0 10px var(--neon)}

/* Sections */
section.blk{padding-top:40px;scroll-margin-top:80px}
.sec-h{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.sec-h h2{margin:0;font-family:var(--font-display);font-size:clamp(22px,4vw,28px);letter-spacing:-.02em}
.sec-h .arrow{color:var(--neon);width:24px;height:24px}
.sec-h .live{width:9px;height:9px;border-radius:50%;background:var(--neon);box-shadow:0 0 12px var(--neon);animation:pulse 1.6s infinite}
@keyframes pulse{50%{opacity:.35;transform:scale(.8)}}

.row{display:flex;gap:16px;overflow-x:auto;scroll-snap-type:x proximity;margin-inline:-16px;padding:6px 16px 14px;scrollbar-width:thin;scrollbar-color:var(--neon) transparent}
.tcard{flex:none;width:min(78vw,300px);scroll-snap-align:start;text-align:left;display:flex;flex-direction:column;gap:12px;transition:transform .3s cubic-bezier(.2,.8,.2,1)}
.tcard:hover{transform:translateY(-5px)}
.tcard .banner{aspect-ratio:2/1;border-radius:18px;position:relative;overflow:hidden;border:1px solid var(--line);transition:.3s}
.tcard:hover .banner{border-color:var(--neon);box-shadow:0 10px 30px -10px var(--neon)}
.tcard .meta{display:flex;gap:12px;align-items:center;min-width:0}
.tcard .meta div{min-width:0}
.tcard .meta strong{display:block;font-family:var(--font-display);font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tcard .meta span{display:block;color:var(--muted);font-size:14px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.rank{position:absolute;top:10px;left:10px;font-family:var(--font-display);font-weight:800;font-size:13px;background:#000b;color:var(--neon);border:1px solid var(--neon);padding:2px 10px;border-radius:999px;backdrop-filter:blur(4px)}

.ico{flex:none;display:grid;place-items:center;color:#fff;position:relative;overflow:hidden}
.ico svg{width:56%;height:56%;filter:drop-shadow(0 2px 6px #0006)}
.ico img{width:100%;height:100%;object-fit:cover;display:block}
img.shot{object-fit:cover;padding:0;background:var(--surface)}
.ico.s{width:52px;height:52px;border-radius:14px}
.ico.m{width:76px;height:76px;border-radius:20px}
.ico.l{width:112px;height:112px;border-radius:28px}
.ico.xl{width:130px;height:130px;border-radius:32px}
.banner .big{position:absolute;inset:0;display:grid;place-items:center}
.banner .big svg{width:34%;height:auto;color:#ffffffd9;filter:drop-shadow(0 6px 18px #0007)}

.icons{display:flex;gap:18px;overflow-x:auto;margin-inline:-16px;padding:6px 16px 14px;scrollbar-width:none}
.icons::-webkit-scrollbar{display:none}
.icard{flex:none;width:96px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px;transition:transform .3s}
.icard:hover{transform:translateY(-4px)}
.icard:hover .ico{box-shadow:0 0 22px var(--neon)}
.icard strong{font-size:13px;font-weight:700;line-height:1.25;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:12px}
.lcard{display:flex;gap:14px;align-items:center;padding:14px;border:1px solid var(--line);background:var(--surface);border-radius:18px;text-align:left;transition:.25s;min-width:0}
.lcard:hover{border-color:var(--neon);background:var(--surface-2);transform:translateY(-3px);box-shadow:0 10px 28px -14px var(--neon)}
.lcard .t{flex:1;min-width:0}
.lcard strong{display:block;font-family:var(--font-display);font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lcard small{display:block;color:var(--muted);font-size:13px}
.get{flex:none;padding:7px 16px;border-radius:999px;border:1px solid var(--neon);color:var(--neon);font-weight:700;font-size:13px;letter-spacing:.04em;text-transform:uppercase;transition:.2s}
.lcard:hover .get{background:var(--neon);color:var(--on-neon)}
.empty{color:var(--muted);padding:28px;border:1px dashed var(--line);border-radius:18px;text-align:center}

footer{margin-top:64px;border-top:1px solid var(--line);padding-block:28px 40px;color:var(--muted);font-size:14px}
footer .wrap{display:flex;flex-wrap:wrap;gap:12px 24px;justify-content:space-between;align-items:center}
footer button{color:var(--neon);font-weight:700}

/* Detail sheet */
.sheet{position:fixed;inset:0;z-index:60;background:var(--bg);overflow-y:auto;transform:translateY(100%);visibility:hidden;transition:transform .45s cubic-bezier(.2,.8,.2,1),visibility 0s .45s;padding-bottom:calc(40px + env(safe-area-inset-bottom,0px))}
.sheet.on{transform:none;visibility:visible;transition:transform .45s cubic-bezier(.2,.8,.2,1)}
.sheet .top{position:sticky;top:0;z-index:2;padding:calc(12px + env(safe-area-inset-top,0px)) 16px 12px;display:flex}
.sheet .back{display:flex;align-items:center;gap:6px;background:#000a;border:1px solid var(--line);backdrop-filter:blur(8px);border-radius:999px;padding:8px 16px 8px 10px;color:var(--neon);font-weight:700}
.sheet .back svg{width:18px;height:18px}
.d-banner{height:min(46vw,300px);margin-top:-66px;position:relative;overflow:hidden}
.d-banner::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#0000 40%,var(--bg))}
.d-head{display:flex;gap:20px;flex-wrap:wrap;align-items:flex-end;margin-top:-56px;position:relative;z-index:1}
.d-head .ico{border:3px solid var(--bg);box-shadow:0 0 28px var(--neon-dim)}
.d-head .txt{flex:1;min-width:min(100%,240px)}
.d-head h2{margin:0;font-family:var(--font-display);font-size:clamp(26px,6vw,40px);letter-spacing:-.025em;line-height:1.1;text-wrap:balance}
.d-head .dev{color:var(--neon);font-weight:500;margin-top:4px}
.stats{display:flex;flex-wrap:wrap;gap:0;margin-top:22px;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--surface)}
.stat{flex:1 1 90px;padding:12px 14px;text-align:center;border-right:1px solid var(--line)}
.stat:last-child{border-right:0}
.stat b{display:block;font-family:var(--font-display);font-size:18px;font-variant-numeric:tabular-nums}
.stat span{color:var(--muted);font-size:12px;letter-spacing:.06em;text-transform:uppercase}
.dl{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;gap:10px;width:100%;max-width:420px;height:54px;margin-top:22px;border-radius:14px;background:var(--neon);color:var(--on-neon);font-family:var(--font-display);font-weight:800;font-size:16px;letter-spacing:.02em;box-shadow:0 0 28px var(--neon-dim);transition:transform .2s,box-shadow .2s}
.dl:hover{transform:translateY(-2px);box-shadow:0 8px 34px -4px var(--neon)}
.dl svg{width:20px;height:20px}
.dl .fill{position:absolute;inset:0;background:#031007;transform-origin:left;transform:scaleX(0);opacity:.0}
.dl.busy{background:var(--surface-2);color:var(--neon);border:1px solid var(--neon)}
.dl.busy .fill{background:var(--neon);opacity:1;animation:fill 2.4s linear forwards}
.dl.busy span,.dl.busy svg{position:relative;mix-blend-mode:difference;color:#fff}
@keyframes fill{to{transform:scaleX(1)}}
.note{color:var(--muted);font-size:13px;margin-top:10px}
.d-sec{margin-top:36px}
.d-sec h3{font-family:var(--font-display);font-size:20px;margin:0 0 12px}
.d-sec p{max-width:65ch;margin:0;color:#c6dccf}
.shots{display:flex;gap:14px;overflow-x:auto;margin-inline:-16px;padding:4px 16px 12px;scroll-snap-type:x mandatory;scrollbar-width:thin;scrollbar-color:var(--neon) transparent}
.shot{flex:none;width:min(46vw,190px);aspect-ratio:9/16;border-radius:20px;scroll-snap-align:start;border:1px solid var(--line);position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;padding:14px}
.shot small{font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:11px;color:#fff;text-shadow:0 1px 8px #000}
.feat{display:grid;gap:10px;padding:0;margin:0;list-style:none;max-width:65ch}
.feat li{display:flex;gap:10px;color:#c6dccf}
.feat li::before{content:"";flex:none;width:8px;height:8px;margin-top:9px;border-radius:50%;background:var(--neon);box-shadow:0 0 10px var(--neon)}
.sample{display:inline-block;font-size:12px;color:var(--muted);border:1px dashed var(--line);border-radius:999px;padding:2px 10px;margin-top:10px}

/* Contact modal */
.modal{position:fixed;inset:0;z-index:70;display:grid;place-items:center;padding:16px;background:#000b;backdrop-filter:blur(6px);opacity:0;visibility:hidden;transition:.25s}
.modal.on{opacity:1;visibility:visible}
.panel{width:min(440px,100%);background:var(--surface);border:1px solid var(--neon);border-radius:24px;padding:26px;box-shadow:0 0 60px var(--neon-dim);transform:translateY(14px) scale(.97);transition:.3s cubic-bezier(.2,.8,.2,1)}
.modal.on .panel{transform:none}
.panel h2{margin:0 0 4px;font-family:var(--font-display);font-size:26px}
.panel p{margin:0 0 18px;color:var(--muted)}
.c-row{display:flex;align-items:center;gap:12px;padding:14px;border:1px solid var(--line);border-radius:16px;margin-top:10px;background:var(--bg)}
.c-row svg{width:22px;height:22px;color:var(--neon);flex:none}
.c-row div{flex:1;min-width:0}
.c-row small{display:block;color:var(--muted);font-size:12px;letter-spacing:.06em;text-transform:uppercase}
.c-row b{display:block;font-weight:500;overflow-wrap:anywhere;user-select:all}
.copy{flex:none;padding:6px 12px;border-radius:999px;border:1px solid var(--neon);color:var(--neon);font-size:12px;font-weight:700;transition:.2s}
.copy:hover,.copy.ok{background:var(--neon);color:var(--on-neon)}
.panel .close{margin-top:18px;width:100%;height:46px;border-radius:12px;border:1px solid var(--line);color:var(--muted);font-weight:700}
.panel .close:hover{color:var(--fg);border-color:var(--neon)}

/* Entrada */
.rise{animation:rise .6s cubic-bezier(.2,.8,.2,1) both}
@keyframes rise{from{opacity:.001;transform:translateY(14px)}to{opacity:1;transform:none}}

@media(min-width:820px){
  nav.desk{display:flex}
  .burger{display:none}
  .slide{width:min(62%,720px)}
  .hero,.row,.icons,.shots{margin-inline:0;padding-inline:0}
  .hero{scroll-padding-inline:0}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>

</head>

      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="m4 7 8 6 8-6"/></svg>
      <div><small>Correo</small><b id="mail">joeljhonpierosatornicio@gmail.com</b></div>
      <button class="copy" data-copy="mail">Copiar</button>
    </div>
    <div class="c-row">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"/></svg>
      <div><small>Teléfono</small><b id="tel">977 368 277</b></div>
      <button class="copy" data-copy="tel">Copiar</button>
    </div>
    <button class="close" id="closeContact">Cerrar</button>
  </div>
</div>

<script>
/* ===== LISTA DE APPS =====
   Para añadir una app copia un bloque y cambia los datos.
   link: pon aquí tu enlace de MediaFire. */
const MEDIAFIRE = "https://www.mediafire.com/"; // enlace provisional
let APPS = [
  /* IMÁGENES (opcionales). Guárdalas en la carpeta "images" junto a index.html y escribe:
     img:"images/master-music-icono.png"      icono cuadrado (512x512)
     banner:"images/master-music-banner.jpg"  imagen ancha (1280x720)
     shots:["images/mm-1.jpg","images/mm-2.jpg"]  capturas verticales (1080x1920)
     Si no pones una imagen, se usa el dibujo de colores. */
  {id:"master-music", name:"Master Music", cat:"Apps", sub:"Reproductor de música sin anuncios", dev:"modsapk", ver:"4.2.1", size:"28 MB", rating:4.7, votes:"126K", age:"3+", sample:false,
   c1:"#39ff6a", c2:"#0b3d1c", icon:"music", featured:true, trending:true, tag:"Novedad", updated:"Hoy",
   desc:"Reproductor de música con ecualizador de 10 bandas, modo sin conexión y listas inteligentes. Funciona con tus archivos locales y se abre en menos de un segundo.",
   feats:["Ecualizador de 10 bandas con presets","Temporizador de apagado","Letras sincronizadas","Tema oscuro con acentos neón"],
   link:MEDIAFIRE},
  {id:"tools-archiver", name:"Tools Archiver", cat:"Apps", sub:"Comprime y abre ZIP, RAR y 7z", dev:"modsapk", ver:"2.9.0", size:"14 MB", rating:4.5, votes:"58K", age:"3+", sample:false,
   c1:"#19d4ff", c2:"#07243a", icon:"archive", featured:true, trending:true, tag:"Actualización", updated:"Ayer",
   desc:"Gestor de archivos comprimidos. Crea, abre y extrae ZIP, RAR y 7z con contraseña, y previsualiza el contenido antes de extraer.",
   feats:["Soporta ZIP, RAR, 7z y TAR","Extracción con contraseña","Vista previa de imágenes y texto","Procesa varios archivos a la vez"],
   link:MEDIAFIRE},
  {id:"battery-health", name:"Batería Salud Test", cat:"Apps", sub:"Mide el estado real de tu batería", dev:"modsapk", ver:"1.8.4", size:"6 MB", rating:4.4, votes:"34K", age:"3+", sample:false,
   c1:"#c6ff39", c2:"#233a05", icon:"battery", featured:true, trending:true, tag:"Tendencia", updated:"Hace 2 días",
   desc:"Analiza la salud de la batería, la temperatura y el voltaje en tiempo real. Muestra la capacidad estimada y avisa cuando conviene cambiarla.",
   feats:["Porcentaje de salud estimado","Temperatura y voltaje en vivo","Historial de cargas","Alerta de sobrecarga"],
   link:MEDIAFIRE},
  {id:"gameplay-racing", name:"Gameplay Racing", cat:"Juegos", sub:"Carreras aéreas a toda velocidad", dev:"Ejemplo", ver:"3.1.0", size:"1.2 GB", rating:4.3, votes:"88K", age:"7+", sample:true,
   c1:"#ff8a39", c2:"#3a1305", icon:"game", featured:true, trending:true, tag:"Ejemplo", updated:"Hoy",
   desc:"Juego de ejemplo para mostrar cómo se verá un juego en la tienda. Cambia este texto por la descripción real cuando subas tu juego.",
   feats:["Más de 300 pruebas","Autos con mejoras","Modo multijugador"],
   link:MEDIAFIRE},
  {id:"gameplay-shooter", name:"Gameplay Shooter", cat:"Juegos", sub:"Disparos tácticos en equipo", dev:"Ejemplo", ver:"1.6.2", size:"640 MB", rating:4.1, votes:"42K", age:"12+", sample:true,
   c1:"#ff3978", c2:"#3a0517", icon:"game", featured:false, trending:true, tag:"Ejemplo", updated:"Hace 3 días",
   desc:"Juego de ejemplo. Sustituye este bloque por los datos reales de tu juego.",
   feats:["Partidas de 5 contra 5","Armas personalizables","Mapas nuevos cada semana"],
   link:MEDIAFIRE},
  {id:"gameplay-puzzle", name:"Gameplay Puzzle", cat:"Juegos", sub:"Rompecabezas relajante", dev:"Ejemplo", ver:"2.0.0", size:"92 MB", rating:4.6, votes:"71K", age:"3+", sample:true,
   c1:"#b039ff", c2:"#1d0537", icon:"game", featured:false, trending:false, tag:"Ejemplo", updated:"Hace 5 días",
   desc:"Juego de ejemplo. Edita esta ficha cuando agregues tu propio juego.",
   feats:["Más de 500 niveles","Sin conexión","Pistas gratis cada día"],
   link:MEDIAFIRE}
];
const GLYPH = {
  music:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V6l11-2v12"/><circle cx="6.5" cy="18" r="2.5" fill="currentColor"/><circle cx="17.5" cy="16" r="2.5" fill="currentColor"/></svg>',
  archive:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="5" rx="1.5"/><path d="M5 9v10a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V9M10 13h4"/></svg>',
  battery:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="16" height="10" rx="2.5"/><path d="M22 11v2"/><path d="m11.5 9-2 3.5h3l-2 3.5" /></svg>',
  game:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="11" rx="5"/><path d="M7 10v5M4.5 12.5h5M16 11.5h.01M18.5 13.5h.01"/></svg>'
};
const art = a => a.banner ? `background:linear-gradient(180deg,#0000 40%,#000b),url('${a.banner}') center/cover` : `background:radial-gradient(120% 90% at 78% 12%,${a.c1}66,transparent 60%),linear-gradient(135deg,${a.c2},#050706)`;
const icoBg = a => `background:linear-gradient(145deg,${a.c1},${a.c2})`;
const $ = s => document.querySelector(s);
const byId = id => APPS.find(a => a.id === id);
let cat = "Todo", query = "";

const ico = (a, size) => a.img ? `<span class="ico ${size}"><img src="${a.img}" alt="${a.name}"></span>` : `<span class="ico ${size}" style="${icoBg(a)}">${GLYPH[a.icon]}</span>`;
const norm = s => s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");

function renderChips(){
  const cats = ["Todo","Apps","Juegos","Tendencias"];
  $("#chips").innerHTML = cats.map(c => `<button class="chip ${c===cat?"on":""}" data-cat="${c}">${c}</button>`).join("");
}
function passes(a){
  if (query && !norm(a.name+" "+a.sub).includes(norm(query))) return false;
  if (cat==="Apps") return a.cat==="Apps";
  if (cat==="Juegos") return a.cat==="Juegos";
  if (cat==="Tendencias") return a.trending;
  return true;
}
function render(){
  const list = APPS.filter(passes);
  const feat = list.filter(a => a.featured);
  $("#hero").innerHTML = (feat.length?feat:list).map(a => `
    <button class="slide" data-open="${a.id}" aria-label="${a.name}">
      <div class="art" style="${art(a)}"></div>
      <div class="banner" style="position:absolute;inset:0"><div class="big">${a.banner?"":GLYPH[a.icon]}</div></div>
      <span class="pill">${a.tag}</span>
      <div class="cap"><div><h3>${a.name}</h3><p>${a.sub}</p></div>${ico(a,"s")}</div>
    </button>`).join("") || `<div class="empty" style="width:100%">No hay resultados para esa búsqueda.</div>`;
  const slides = $("#hero").children.length;
  $("#dots").innerHTML = Array.from({length:slides},(_,i)=>`<i class="${i===0?"on":""}"></i>`).join("");

  const tr = list.filter(a => a.trending);
  $("#trend").innerHTML = tr.map((a,i) => `
    <button class="tcard" data-open="${a.id}">
      <div class="banner" style="${art(a)}"><span class="rank">#${i+1} en tendencia</span><div class="big">${a.banner?"":GLYPH[a.icon]}</div></div>
      <div class="meta">${ico(a,"s")}<div><strong>${a.name}</strong><span>${a.sub}</span></div></div>
    </button>`).join("") || `<div class="empty" style="width:100%">Sin tendencias para mostrar.</div>`;

  $("#latest").innerHTML = list.map(a => `
    <button class="icard" data-open="${a.id}">${ico(a,"m")}<strong>${a.name}</strong></button>`).join("") || `<div class="empty" style="width:100%">Sin resultados.</div>`;

  const lc = a => `<button class="lcard" data-open="${a.id}">${ico(a,"s")}<div class="t"><strong>${a.name}</strong><small>${a.cat} · ${a.size} · ★ ${a.rating}</small></div><span class="get">Ver</span></button>`;
  const apps = list.filter(a => a.cat==="Apps"), games = list.filter(a => a.cat==="Juegos");
  $("#grid").innerHTML = apps.map(lc).join("") || `<div class="empty">No hay apps en esta vista.</div>`;
  $("#games").innerHTML = games.map(lc).join("") || `<div class="empty">No hay juegos en esta vista.</div>`;
}

/* Detalle */
function openDetail(id){
  const a = byId(id); if(!a) return;
  $("#detail").innerHTML = `
    <div class="d-banner" style="${art(a)}"></div>
    <div class="wrap">
      <div class="d-head rise">
        ${ico(a,"xl")}
        <div class="txt"><h2>${a.name}</h2><div class="dev">${a.dev} · ${a.cat}</div>${a.sample?'<span class="sample">Ficha de ejemplo</span>':''}</div>
      </div>
      <div class="stats rise">
        <div class="stat"><b>★ ${a.rating}</b><span>${a.votes} votos</span></div>
        <div class="stat"><b>${a.size}</b><span>Tamaño</span></div>
        <div class="stat"><b>${a.age}</b><span>Edad</span></div>
        <div class="stat"><b>v${a.ver}</b><span>${a.updated}</span></div>
      </div>
      <a class="dl rise" id="dl" href="${a.link}" target="_blank" rel="noopener"><i class="fill"></i><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11m0 0 4-4m-4 4-4-4M5 20h14"/></svg><span>Descargar</span></a>
      <div class="note">Se abre MediaFire en una pestaña nueva.</div>
      <div class="d-sec"><h3>Capturas</h3>
        <div class="shots">${a.shots&&a.shots.length?a.shots.map(u=>`<img class="shot" src="${u}" alt="Captura de ${a.name}" loading="lazy">`).join(""):["Inicio","Ajustes","Detalle","Modo oscuro"].map((t,i)=>`<div class="shot" style="background:radial-gradient(110% 70% at ${30+i*15}% 10%,${a.c1}${i%2?"55":"88"},transparent 62%),linear-gradient(160deg,${a.c2},#050706)"><small>${t}</small></div>`).join("")}</div>
      </div>
      <div class="d-sec"><h3>Descripción</h3><p>${a.desc}</p></div>
      <div class="d-sec"><h3>Características</h3><ul class="feat">${a.feats.map(f=>`<li>${f}</li>`).join("")}</ul></div>
    </div>`;
  const s = $("#sheet"); s.classList.add("on"); s.setAttribute("aria-hidden","false"); s.scrollTop = 0;
  document.body.style.overflow = "hidden";
}
function closeDetail(){
  const s = $("#sheet"); s.classList.remove("on"); s.setAttribute("aria-hidden","true");
  document.body.style.overflow = "";
}

/* Menú */
const drawer = $("#drawer"), scrim = $("#scrim");
const menu = on => { drawer.classList.toggle("on",on); scrim.classList.toggle("on",on); };
$("#openMenu").onclick = () => menu(true);
scrim.onclick = () => menu(false);
drawer.addEventListener("click", e => { if (e.target.closest("a")) menu(false); });

/* Contacto */
const modal = $("#contact");
const contact = on => { modal.classList.toggle("on",on); modal.setAttribute("aria-hidden",String(!on)); };
$("#closeContact").onclick = () => contact(false);
modal.addEventListener("click", e => { if (e.target === modal) contact(false); });
document.addEventListener("keydown", e => { if (e.key==="Escape"){ contact(false); closeDetail(); menu(false);} });
modal.addEventListener("click", async e => {
  const b = e.target.closest("[data-copy]"); if(!b) return;
  const el = document.getElementById(b.dataset.copy);
  const txt = b.dataset.copy==="tel" ? el.textContent.replace(/\s/g,"") : el.textContent;
  try { await navigator.clipboard.writeText(txt); b.textContent="Copiado"; b.classList.add("ok"); }
  catch { const r=document.createRange(); r.selectNodeContents(el); const s=getSelection(); s.removeAllRanges(); s.addRange(r); b.textContent="Selecciona y copia"; }
  setTimeout(()=>{b.textContent="Copiar"; b.classList.remove("ok");},1800);
});

/* Eventos globales */
document.addEventListener("click", e => {
  const c = e.target.closest("[data-contact]"); if (c){ menu(false); contact(true); return; }
  const o = e.target.closest("[data-open]"); if (o){ openDetail(o.dataset.open); return; }
  const ch = e.target.closest("[data-cat]"); if (ch){ cat = ch.dataset.cat; renderChips(); render(); return; }
  const dl = e.target.closest("#dl");
  if (dl && !dl.classList.contains("busy")){
    dl.classList.add("busy"); dl.querySelector("span").textContent = "Descargando…";
    setTimeout(()=>{ dl.classList.remove("busy"); dl.querySelector("span").textContent = "Descargar"; }, 2500);
  }
});
$("#back").onclick = closeDetail;
$("#q").addEventListener("input", e => { query = e.target.value.trim(); render(); });
$("#hero").addEventListener("scroll", () => {
  const h = $("#hero"), n = h.children.length; if(!n) return;
  const i = Math.round(h.scrollLeft / (h.scrollWidth - h.clientWidth || 1) * (n-1));
  [...$("#dots").children].forEach((d,k)=>d.classList.toggle("on",k===i));
}, {passive:true});

renderChips();
/* Lee apps.json (lo genera el panel admin). Si no existe, usa la lista de arriba. */
fetch("apps.json",{cache:"no-store"}).then(r=>r.ok?r.json():Promise.reject()).then(d=>{if(Array.isArray(d))APPS=d;}).catch(()=>{}).finally(render);
</script>
</body>
</html>
